model: Sandbox Apps
description: >-
  Evervault provides Sandbox Apps - isolated test environments that mirror
  production behaviour and grant access to all platform features. Data
  encrypted with a sandbox app can only be decrypted with that same app key,
  preventing cross-environment leakage.
separation:
  mechanism: per-app keys (sandbox app vs production app)
  note: Test-vs-live is separated at the App level rather than by key prefix.
