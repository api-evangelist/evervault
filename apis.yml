aid: evervault
name: Evervault
description: >-
  Evervault is a data-security and payments-infrastructure platform that lets developers
  encrypt, tokenize, and process sensitive data - especially cardholder data - without it
  touching their own infrastructure. Its model stores encryption keys on Evervault's side
  while customers hold the ciphertext, reducing breach scope. Core products include Relay
  (an encrypting/decrypting proxy), Functions (secure serverless runtimes), Enclaves (AWS
  Nitro Enclave workloads), UI Components for PCI-compliant card collection, plus payments
  tooling: network tokens, 3D Secure, BIN lookup, card account updater, and multi-PSP
  routing. Evervault is PCI DSS Level 1 and SOC 2 Type II, and supports HIPAA and GDPR.
