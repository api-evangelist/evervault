                    brand: visa
                    funding: credit
                    segment: consumer
                    country: gb
                    currency: gbp
                    issuer: Gringotts Wizarding Bank and Trust Company
                    status: active
                    replacement: null
                    automaticUpdates: enabled
                    createdAt: 169297262323
                    updatedAt: null
        '201':
