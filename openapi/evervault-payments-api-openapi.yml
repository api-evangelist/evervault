  /payments/cards/checks/simulate:
    post:
      summary: Simulate an Account Updater Check
      description: 'Simulate a card check so you can test your

        integration without a real query to the card networks. Provide the test card

        `4242424242424242` and the `type` of result you want returned.


        The response is an Account Updater Check,

        identical in shape to a live check. A `new-account-number` result returns

        `4111111111111111` as the replacement card, as an Evervault encrypted string.


        Checks can only be simulated for the test card `4242424242424242`. Any other card

        returns a `400` response.


        This endpoint is only available to Sandbox apps.'
      operationId: simulateAccountUpdaterCheck
      tags:
      - Payments
      security:
      - ApiKey:
        - card:checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card:
                  type: object
                  properties:
                    number:
                      type: string
                      description: The card number. Must be the test card `4242424242424242`, as plaintext or a valid Evervault encrypted card number.
                      example: '4242424242424242'
                    expiry:
                      $ref: '#/components/schemas/CardExpiry'
                  required:
                  - number
                  - expiry
                type:
                  type: string
                  description: The check result to simulate. Accepts any of the results a live check can return.
                  enum:
                  - no-change
                  - new-expiry-date
                  - new-account-number
                  - account-closed
                  - contact-cardholder
                  - cardholder-opt-out
                  - merchant-opt-out
                  - no-match
                  example: new-account-number
              required:
              - card
              - type
            examples:
              NewAccountNumberExample:
                summary: Simulate a new account number
                value:
                  card:
                    number: '4242424242424242'
                    expiry:
                      month: '12'
                      year: '28'
                  type: new-account-number
              NewExpiryDateExample:
                summary: Simulate a new expiry date
                value:
                  card:
                    number: '4242424242424242'
                    expiry:
                      month: '12'
                      year: '28'
                  type: new-expiry-date
              AccountClosedExample:
                summary: Simulate a closed account
                value:
                  card:
                    number: '4242424242424242'
                    expiry:
                      month: '12'
                      year: '28'
                  type: account-closed
      responses:
        '200':
          description: The simulated check completed.
          x-content: 'Returns the [Account Updater Check object](#the-account-updater-check-object),

            identical in shape to a live check.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdaterCheck'
              examples:
                NewAccountNumberExample:
                  summary: New account number
                  value:
                    id: auc_8da9a7fbde01
                    result: new-account-number
                    update:
                      card:
                        number: ev:debug:Tk9D:number:nTepvAI585M7lUVp:AkJ6Brzat0E7ui8DSKCSXO7AopU/+GFuBekQ6cGx7eTl:sfihK53itmHp+URxomnTITUpwQwM5nnRrnQ0qdIOUlA=:$
                        expiry:
                          month: '04'
                          year: '30'
                NewExpiryDateExample:
                  summary: New expiry date
                  value:
                    id: auc_8da9a7fbde01
                    result: new-expiry-date
                    update:
                      card:
                        expiry:
                          month: '04'
                          year: '30'
                AccountClosedExample:
                  summary: Account closed
                  value:
                    id: auc_8da9a7fbde01
                    result: account-closed
                    update: null
        '400':
          description: 'The request was invalid or cannot be otherwise served.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidRequest:
                  summary: Invalid request
                  value:
                    status: 400
                    code: invalid-request
                    title: Invalid request
                    detail: 'A malformed expiry, missing field, or bad ev: ciphertext was provided.'
                NotSimulatable:
                  summary: Not the test card
                  value:
                    status: 400
                    code: invalid-request
                    title: Invalid request
                    detail: Checks can only be simulated for the test card 4242424242424242.
        '401':
          description: 'The request cannot be authenticated.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    status: 401
                    code: unauthorized
                    title: Unauthorized
                    detail: The API key is missing or invalid.
        '403':
          description: 'The request is not authorized to perform this action.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SandboxOnly:
                  summary: Sandbox only
                  value:
                    status: 403
