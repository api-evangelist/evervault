      responses:
        '200':
          description: Returns an Acquirer object.
          x-content: 'Returns the [Acquirer object](#the-acquirer-object).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquirerConfiguration'
              examples:
                SimpleExample:
                  summary: Acquirer successfully retrieved
                  value:
                    id: acquirer_adk3kdljc3
                    name: Ollivanders Wand Shop Production Configuration
                    description: Ollivanders Wand Shop Production Configuration
                    default: true
                    configurations:
                    - network: mastercard
                      bin: '424242'
                      acquirerMerchantIdentifier: '38191048173'
