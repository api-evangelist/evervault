      tags:
      - Payments
      security:
      - ApiKey:
        - card:subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card:
                  type: object
                  properties:
                    number:
                      type: string
                      description: The card number. This can be a plaintext card number or a valid Evervault encrypted card number.
                      example: ev:debug:Tk9D:number:nTepvAI585M7lUVp:AkJ6Brzat0E7ui8DSKCSXO7AopU/+GFuBekQ6cGx7eTl:sfihK53itmHp+URxomnTITUpwQwM5nnRrnQ0qdIOUlA=:$
                    expiry:
                      $ref: '#/components/schemas/CardExpiry'
                  required:
                  - number
                  - expiry
              required:
              - card
            examples:
              EvervaultEncryptedExample:
                summary: Encrypted card number
                value:
                  card:
                    number: ev:debug:Tk9D:number:nTepvAI585M7lUVp:AkJ6Brzat0E7ui8DSKCSXO7AopU/+GFuBekQ6cGx7eTl:sfihK53itmHp+URxomnTITUpwQwM5nnRrnQ0qdIOUlA=:$
                    expiry:
                      month: '12'
                      year: '28'
              PlaintextCardExample:
                summary: Plaintext card number
                value:
                  card:
                    number: '4242424242424242'
                    expiry:
                      month: '12'
                      year: '28'
