    ThreeDSDcap:
      type:
      - 'null'
      - object
      description: 'The session''s standing in Visa''s Digital Commerce Authentication Program (DCAP). This value is only present for Visa sessions created with a `challenge.reason` of `data-sharing`, and is `null` otherwise.

        '
      properties:
        qualified:
          type: boolean
          description: 'Whether the session supplied every data point the program requires, so the transaction was submitted to Visa for DCAP.

            '
          example: true
        accepted:
          type:
          - 'null'
          - boolean
          description: 'Whether Visa reported the supplied data as meeting the program''s data quality requirements. This value is `null` while Visa hasn''t returned a verdict, and whenever `qualified` is `false`.

            '
          example: true
      required:
      - qualified
    CardArt:
      type: object
      properties:
        type:
          type: string
          description: The MIME type of the card art image.
          example: image/png
        data:
          type: string
          description: The base64-encoded image data of the card art.
          example: dGhlIGJhc2U2NCBlbmNvZGVkIGltYWdlIGRhdGE=
        width:
          type: integer
          description: The width of the card art image in pixels.
          example: 1536
        height:
          type: integer
          description: The height of the card art image in pixels.
          example: 969
      required:
      - type
      - data
      - width
      - height
    NetworkToken:
      summary: The Network Token Object
      type: object
      properties:
        id:
          type: string
          description: A unique identifier representing a specific Network Token.
          example: network_token_eead1d640d7c
        number:
          type: string
          description: The unique number of the Network Token.
          example: '4545454545454545'
        expiry:
          type: object
          description: The expiry details of the Network Token.
          $ref: '#/components/schemas/NetworkTokenExpiry'
        card:
          type: object
          description: The details of the underlying encrypted card.
          properties:
            lastFour:
              type: string
              description: The last four digits of the card number.
              example: '4545'
            expiry:
              type: object
              description: The expiry details of the card.
              properties:
                month:
                  type: string
                  description: The month of the card's expiry date, in MM format (e.g. 12 for December)
                  example: '12'
                year:
                  type: string
                  description: The year of the card's expiry date, in YY format (e.g. 26 for 2026)
                  example: '23'
            brand:
              type: string
              enum:
              - visa
              - mastercard
              - american-express
              description: The card brand associated with the payment card.
              example: visa
          required:
          - lastFour
          - expiry
          - brand
        tokenRequestorIdentifier:
          type: string
          description: The identifier of the Token Requestor (TRID) that requested the Network Token.
          example: '50165156978'
        tokenServiceProvider:
          type: string
          description: The Token Service Provider (TSP) that issued the Network Token.
          enum:
          - mdes
          - vts
          - aets
        paymentAccountReference:
          type: string
          description: The unique identifier of the Payment Account associated with this Network Token.
          example: 512381d9f8e0629211e3949a08002
        status:
          type: string
          enum:
          - active
          - inactive
          - blocked
          - provisioning
          - suspended
          - deleted
          - expired
          description: The status of the Network Token. Active means the token is valid and can be used for payments. Inactive means the token exists but is not currently active. Blocked and provisioning are reserved for future use. Suspended means the token is temporarily unusable but may be reactivated by the issuer or transition to deleted. Deleted is a terminal state where the token is permanently removed and a new credential must be obtained. Expired means the token has passed its expiration date and should not be used for transactions.
          example: active
        merchant:
          type: string
          description: The unique identifier of the Merchant associated with this Network Token.
          example: merchant_eead1d640d7c
        createdAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this Network Token was created.
          example: 1692972623233
        updatedAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this Network Token was last updated.
          example: 1692972623768
      required:
      - id
      - number
      - expiry
      - card
      - tokenRequestorIdentifier
      - tokenServiceProvider
      - status
      - merchant
      - createdAt
      example:
        id: network_token_eead1d640d7c
        number: '4498004918463434'
        expiry:
          month: '13'
          year: '25'
        card:
          lastFour: '4242'
          expiry:
            month: 09
            year: '26'
          brand: visa
        paymentAccountReference: 512381d9f8e0629211e3949a08002
        tokenRequestorIdentifier: '40020248564'
        tokenServiceProvider: vts
        merchant: merchant_ddsaJsda9d86
        status: active
        createdAt: 1692972623233
        updatedAt: 1692972623768
    Card:
      x-section: Payments
      x-group: Cards
      type: object
      summary: The Card Object
      properties:
        id:
          type: string
          description: The unique identifier for the card.
          example: card_eead1d640d7c
        number:
          type: string
          description: The Evervault encrypted card number. This can be decrypted using Relay decryption or using a function.
          example: 'ev:'
        expiry:
          $ref: '#/components/schemas/CardExpiry'
          description: The expiry date of the card.
        bin:
          type: string
          description: The first 6 or 8 digits of the card number.
          example: '424242'
        lastFour:
          type: string
          description: The last 4 digits of the card number.
          example: '4242'
        brand:
          $ref: '#/components/schemas/CardBrand'
        funding:
          $ref: '#/components/schemas/CardFunding'
        segment:
          $ref: '#/components/schemas/CardSegment'
        country:
          type: string
          format: iso-3166-1-alpha-2
          description: The country where the card was issued.
          example: gb
        currency:
          type: string
          format: iso-4217-alphabetic
          description: The currency of the card.
          example: gbp
        issuer:
          type: string
          description: The name of the card issuer.
          example: Gringotts Wizarding Bank and Trust Company
        status:
          type: string
          description: The current status of the card.
          enum:
          - active
          - replaced
          - closed
          - invalid
          x-enum-description:
            active: The card is active and can be used for transactions.
            replaced: The card has been replaced by another card (e.g. expired, lost or stolen).
            closed: The card account has been closed and can no longer be used for transactions.
            invalid: The card is invalid and cannot be used for transactions or updated.
          example: active
        replacement:
          type:
          - string
          - 'null'
          description: The ID of the replacement card. This field is only present if the card has been replaced.
          example: card_eead1d640d7c
        automaticUpdates:
          type: string
          description: 'The status of Card Account Updater on this card. Evervault currently supports Card Account Updates for Visa, Mastercard and American Express cards.

            '
          enum:
          - enabled
          - issuer-not-enrolled
          - disabled
        createdAt:
          type: integer
          description: The Unix timestamp of when the card was created.
          example: 1692972623233
        updatedAt:
          type:
          - integer
          - 'null'
          description: The Unix timestamp of when the card was last updated.
          example: 1692972623768
      required:
      - number
      - bin
      - lastFour
      - createdAt
      example:
        id: card_eead1d640d7c
        number: ev:debug:Tk9D:number:nTepvAI585M7lUVp:AkJ6Brzat0E7ui8DSKCSXO7AopU/+GFuBekQ6cGx7eTl:sfihK53itmHp+URxomnTITUpwQwM5nnRrnQ0qdIOUlA=:$
        expiry:
          month: '9'
          year: '26'
        bin: '424242'
        lastFour: '4242'
        brand: visa
        funding: credit
        segment: consumer
        country: gb
        currency: gbp
        issuer: Gringotts Wizarding Bank and Trust Company
        status: active
        replacement: null
        automaticUpdates: enabled
        createdAt: 169297262323
        updatedAt: null
    PreChargebackRule:
      type: object
      summary: The Pre-Chargeback Rule Object
      description: 'A Verifi RDR refund rule that controls which alerts Evervault automatically refunds for a merchant.

        '
      properties:
        id:
          type: string
          description: A unique identifier for the rule.
          example: pre_chargeback_rule_eead1d640d7c
        type:
          type: string
          description: The rule type. Currently only `AMOUNT` is supported.
          enum:
          - AMOUNT
          example: AMOUNT
        outcome:
          type: string
          description: The action taken when the rule matches. Currently always `REFUND`.
          enum:
          - REFUND
          example: REFUND
        parameters:
          type: object
          description: The rule parameters. Replaced entirely on update (not merged).
          properties:
            operator:
              type: string
              description: The comparison operator applied to the disputed amount.
              enum:
              - GREATER_THAN
              - GREATER_THAN_OR_EQUAL
              - LESS_THAN
              - LESS_THAN_OR_EQUAL
              - EQUAL
              - NOT_EQUAL
              example: LESS_THAN_OR_EQUAL
            currencyCode:
              type: string
              description: 'The currency used for rule evaluation. Only `USD` is supported. Convert non-USD

                thresholds to USD yourself before creating the rule.

                '
              enum:
              - USD
              example: USD
            amountInCents:
              type: integer
              format: int64
              description: The threshold amount in cents against which the disputed amount is compared.
              minimum: 1
              example: 5000
          required:
          - operator
          - currencyCode
          - amountInCents
        createdAt:
          type: string
          format: date-time
          description: When the rule was created, as an ISO 8601 timestamp in UTC.
          example: '2025-02-11T10:30:00Z'
      required:
      - id
      - type
      - outcome
      - parameters
      - createdAt
      example:
        id: pre_chargeback_rule_eead1d640d7c
        type: AMOUNT
        outcome: REFUND
        parameters:
          operator: LESS_THAN_OR_EQUAL
          currencyCode: USD
          amountInCents: 5000
        createdAt: '2025-02-11T10:30:00Z'
    CardInsightAddress:
      type: object
      summary: The result of the address verification check (AVS)
      properties:
        networkIdentifier:
          type: string
          description: A network generated transaction identifier that is unique to every authorization and financial request.
          example: '1234567890'
        networkResponseCode:
          type: object
          description: Network response code returned when an authorization fails at the network or beyond
          properties:
            code:
              type:
              - 'null'
              - string
              description: A human readable version of the network response code. Always returns `null` until these codes are mapped.
              example: null
            value:
              type: string
              description: The raw network response code
              example: '85'
        result:
          type: object
          description: The result of the address verification check (AVS)
          properties:
            value:
              type: string
              description: The raw result code
              example: Y
            address:
              type: string
              description: The match code for the address portion of the AVS (excludes zip code)
              enum:
              - match
              - no-match
              - unknown
              - unavailable
            zip:
              type: string
              description: The match code for the zip code portion of the address (excludes line1, line2, etc.)
              enum:
              - match
              - no-match
              - unknown
              - unavailable
          required:
          - value
          - address
          - zip
  securitySchemes:
    ApiKey:
      type: http
      scheme: basic
      description: Authentication using an API key. The username is the App ID and the password is the Api Key.
    TokenAuth:
      type: http
      scheme: bearer
      bearerFormat: RunToken
      description: 'Authentication using a short lived run token that you can share with clients. The Authorization header must be formatted as follow: "RunToken <Function Run Token>"'
    ClientSideToken:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: 'Authentication using a short lived token that you can share with clients. The Authorization header must be formatted as follow: "Token <Client-Side Token>"'
