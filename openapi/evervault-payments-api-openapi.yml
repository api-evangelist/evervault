openapi: 3.2.0
info:
  title: Evervault Payments API
  version: 0.0.1
  description: The Evervault API allows developers to interact programmatically with their Evervault apps using HTTP requests.
  contact:
    email: support@evervault.com
    name: Evervault Support Team
    url: https://evervault.com
servers:
- url: https://api.evervault.com
  description: The Evervault API server
tags:
- name: Payments
  x-category: true
paths:
  /insights/cards:
    post:
      summary: Card Insights
      description: 'The Card Insights API allows you to perform address verification (AVS), name verification (ANI), CVV, email, and phone verification checks. You can also check the card''s push and pull transaction capabilities and retrieve the Payment Account Reference (PAR).


        Provide exactly one credential per request: either a `card` or a `networkToken`.'
      operationId: createCardInsight
      tags:
      - Payments
      security:
      - ApiKey:
        - insights:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card:
                  type: object
                  description: The card details. Provide either `card` or `networkToken`, but not both.
                  properties:
                    number:
                      type: string
                      description: The card number. This should be a valid Evervault encrypted card number or a valid plaintext card number.
                      example: '4111111111111111'
                    expiry:
                      allOf:
                      - $ref: '#/components/schemas/CardExpiry'
                      description: The card expiry date. Required if the `address`, `cardholder`, or `cvv` extensions are requested.
                    cvv:
                      type: string
                      description: The card security code. This should be a valid Evervault encrypted CVV or a valid plaintext CVV. Required if the `cvv` extension is requested.
                      example: '123'
                  required:
                  - number
                networkToken:
                  type: object
                  description: The network token details. Provide either `card` or `networkToken`, but not both. The `cvv` extension is not available for network tokens.
                  properties:
                    number:
                      type: string
                      description: The network token number. This should be a valid Evervault encrypted token number or a valid plaintext token number.
                      example: '4111111111111111'
                    cryptogram:
                      type: string
                      description: The token cryptogram. This should be a valid Evervault encrypted cryptogram or a valid plaintext cryptogram.
                      example: AgAAAAAABk4DdZzBRckAAAAA
                    expiry:
                      $ref: '#/components/schemas/NetworkTokenExpiry'
                    transactionIdentifier:
                      type: string
                      description: The transaction identifier for the token. Required for Amex and Discover network tokens.
                      example: '1234567890'
                    brand:
                      type: string
                      description: The card brand the token belongs to. Required for Amex and Discover network tokens.
                      enum:
                      - visa
                      - mastercard
                      - amex
                      - discover
                      example: visa
                    funding:
                      type: string
                      description: The funding type of the card the token belongs to. Required for Amex and Discover network tokens.
                      enum:
                      - credit
                      - debit
                      - prepaid
                      example: credit
                    eci:
                      type: string
                      description: The Electronic Commerce Indicator associated with the token.
                      example: '05'
                  required:
                  - number
                  - cryptogram
                  - expiry
                extensions:
                  type: array
                  description: The extensions to the card insight request.
                  items:
                    type: string
                    description: The extensions
                    enum:
                    - capabilities
                    - fees
                    - cvv
                    - cardholder
                    - address
                    - email
                    - phone
                    - paymentAccountReference
                    x-enum-description:
                      capabilities: Check the card's push and pull transaction capabilities
                      fees: Previously requested the estimated network and interchange fees for push and pull transactions
                      cvv: Check the card's CVV verification
                      cardholder: Check the cardholder's name verification
                      address: Check the cardholder's address verification
                      email: Check the cardholder's email verification
                      phone: Check the cardholder's phone verification
                      paymentAccountReference: Retrieve the Payment Account Reference (PAR) for the card
                    x-enum-deprecated-reason:
                      fees: Card Insights is migrating to PayOS v2, which does not return fee estimates. Requesting this extension has no effect and `fees` always returns `null`.
                cardholder:
                  type: object
                  description: Details about the cardholder that the name verification (ANI) is for. Required if the `cardholder` extension is requested.
                  properties:
                    firstName:
                      type: string
                      description: The first name of the cardholder
                      example: John
                    lastName:
                      type: string
                      description: The last name of the cardholder
                      example: Doe
                    middleName:
                      type: string
                      description: The middle name of the cardholder
                      example: Michael
                    suffix:
                      type: string
                      description: The name suffix of the cardholder
                      example: Jr
                    ownerType:
                      type: string
                      description: Whether the cardholder is the primary or secondary account owner.
                      enum:
                      - primary
                      - secondary
                      x-enum-description:
                        primary: Primary account owner
                        secondary: Secondary account owner
                      example: primary
                email:
                  type: string
                  description: The cardholder's email address that the email verification is for. Required if the `email` extension is requested.
                  example: john.doe@example.com
                phone:
                  type: string
                  description: The cardholder's phone number, in ISD format (`00` followed by the country calling code and the national number), that the phone verification is for. Required if the `phone` extension is requested.
                  example: '0016505551234'
                address:
                  type: object
                  description: Details about the cardholder's address that the address verification (AVS) is for. Required if the `address` extension is requested.
                  properties:
                    postalCode:
                      type: string
                      description: The ZIP or postal code.
                      example: '10001'
                    line1:
                      type: string
                      description: Street address line 1
                      example: 123 Main Street
                    line2:
                      type: string
                      description: Street address line 2
                      example: Apt 4B
                    city:
                      type: string
                      description: The city name
                      example: New York
                    state:
                      type: string
                      description: The state or province code. Required when `country` is `us`, `ca`, or `au`.
                      format: iso-3166-2-subdivision
                      example: ny
                    country:
                      type: string
                      description: The country code.
                      format: iso-3166-1-alpha-2
                      example: us
                  required:
                  - postalCode
            examples:
              SimpleExample:
                value:
                  card:
                    number: '4111111111111111'
                    expiry:
                      month: 09
                      year: '29'
                    cvv: '123'
                  extensions:
                  - capabilities
                  - cvv
                  - address
                  - cardholder
                  - email
                  - phone
                  - paymentAccountReference
                  cardholder:
                    firstName: John
                    lastName: Doe
                    middleName: Michael
                    suffix: Jr
                    ownerType: primary
                  email: john.doe@example.com
                  phone: '0016505551234'
                  address:
                    postalCode: '10001'
                    line1: 123 Main Street
                    line2: Apt 4B
                    city: New York
                    state: ny
                    country: us
              NetworkTokenExample:
                value:
                  networkToken:
                    number: '4111111111111111'
                    cryptogram: AgAAAAAABk4DdZzBRckAAAAA
                    expiry:
                      month: 09
                      year: '29'
                    transactionIdentifier: '1234567890'
                    brand: visa
                    funding: credit
                  extensions:
                  - capabilities
                  - address
                  - cardholder
                  - paymentAccountReference
                  cardholder:
                    firstName: John
                    lastName: Doe
                  address:
                    postalCode: '10001'
                    country: us
      responses:
        '201':
          description: Returns the Card Insight object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInsight'
              examples:
                Success:
                  summary: Successful Card Insight createFunctionRun
                  value:
                    id: card_insight_1234567890
                    fingerprint: WUlcOAgQcTN1GEUaoaKrLH1wL2PZrjsUS7byUGZyUEA
                    bin:
                      brand: visa
                      funding: credit
                      segment: consumer
                      country: us
                      currency: usd
                      issuer: Gringotts Wizarding Bank and Trust Company
                      productName: Visa Credit
                      fastFunds:
                        domestic: true
                        crossBorder: true
                      threeDS:
                        supportedVersions:
                          accessControlServer:
                          - 2.2.0
                          directoryServer:
                          - 2.2.0
                          - 2.3.1
                        acsInfoIndicators:
                        - code: acs-auth-available
                          indicator: '01'
                          description: Authentication Available at ACS
                      type: card
                    capabilities:
                      push:
                        enabled: true
                        network: visa
                        type: credit
                        availability: immediate
                        regulated: true
                        currency:
                          alphaCode: usd
                          numericCode: '840'
                        country:
                          alphaCode: us
                          numericCode: '840'
                      pull:
                        enabled: true
                        network: visa
                        type: credit
                        regulated: true
                        currency:
                          alphaCode: usd
                          numericCode: '840'
                        country:
                          alphaCode: us
                          numericCode: '840'
                    fees: null
                    cvv:
                      code: match
                      value: M
                    email:
                      value: '1'
                      code: match
                    phone:
                      value: '1'
                      code: match
                    address:
                      networkIdentifier: '1234567890'
                      networkResponseCode:
                        code: null
                        value: '85'
                      result:
                        value: Y
                        address: match
                        zip: match
                    cardholder:
                      result:
                        value: M
                        code: match-performed
                      fullName:
                        value: M
                        code: match
                      firstName:
                        value: M
                        code: match
                      lastName:
                        value: M
                        code: match
                    paymentAccountReference: V0010011111111111111111111111
                    createdAt: 169297262323
  /payments/bin-lookups:
    post:
      summary: BIN Lookup
      description: Performs a BIN lookup for the provided card number and retrieves associated information such as the card brand, country, issuer, and more.
      operationId: createBinLookup
      tags:
      - Payments
      security:
      - ApiKey:
        - binLookup:create
      requestBody:
        description: 'The BIN (Bank Identification Number) lookup request body, which includes the card number.

          '
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: 'The card number for which the BIN lookup is being requested.

                    It can be a plaintext Card number (FPAN) / Network Token number (DPAN), an encrypted

                    Card number / Network Token number or simply just a BIN (6-10 first digits of a Card Number) for range lookup.

                    '
              required:
              - number
            examples:
              BinLookupExample:
                summary: Example BIN lookup request
                value:
                  number: '4242424242424242'
      responses:
        '201':
          description: Returns BIN details for the provided card number.
          x-content: 'Returns the [BIN Lookup object](#the-bin-lookup-object) that was created.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinLookup'
              examples:
                SuccessfulLookup:
                  summary: Successful BIN lookup
                  value:
                    id: bin_lookup_1234567890
                    brand: visa
                    funding: credit
                    segment: consumer
                    country: gb
                    currency: gbp
                    issuer: Gringotts Wizarding Bank and Trust Company
                    productName: Visa Debit
                    fastFunds:
                      domestic: true
                      crossBorder: true
                    matchPrecision: 8
                    threeDS:
                      supportedVersions:
                        accessControlServer:
                        - 2.2.0
                        directoryServer:
                        - 2.2.0
                        - 2.3.1
                      acsInfoIndicators:
                      - code: acs-auth-available
                        indicator: '01'
                        description: Authentication Available at ACS
                    type: card
                    createdAt: 169297262323
  /payments/par-lookups:
    post:
      summary: PAR Lookup
      description: 'Looks up the Payment Account Reference (PAR) for a card number or network token. A PAR is a stable identifier

        assigned by the card network that stays constant across card reissues, renewals, and replacements, and is

        shared by every network token derived from the card.'
      operationId: createParLookup
      tags:
      - Payments
      security:
      - ApiKey:
        - parLookup:create
      requestBody:
        description: 'The PAR lookup request body, which includes the card number or network token.

          '
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: 'The card number (FPAN) or network token number (DPAN) for which the PAR is being requested.

                    It can be a plaintext or an Evervault-encrypted number, and must be 12-19 digits and pass a Luhn check.

                    '
              required:
              - number
            examples:
              ParLookupExample:
                summary: Example PAR lookup request
                value:
                  number: '5204248250001003'
      responses:
        '201':
          description: Returns the PAR resolved for the provided card number or network token.
          x-content: 'Returns the [PAR Lookup object](#the-par-lookup-object) that was created.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParLookup'
              examples:
                SuccessfulLookup:
                  summary: Successful PAR lookup
                  value:
                    id: par_lookup_1234567890
                    paymentAccountReference: 5001BN2CUZCOY2H2IJILTJJZWTEPW
        '400':
          description: 'The request was invalid or cannot be otherwise served.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidNumber:
                  summary: Invalid Number
                  value:
                    code: invalid-request
                    title: Invalid Request
                    detail: The card number or network token is invalid. It must be 12-19 digits and pass a Luhn check.
                    status: 400
                InvalidEncryptedNumber:
                  summary: Invalid Encrypted Number
                  value:
                    code: invalid-request
                    title: Invalid Request
                    detail: Encrypted number is invalid
                    status: 400
                DecryptionError:
                  summary: Decryption Error
                  value:
                    code: invalid-request
                    title: Invalid Request
                    detail: Error decrypting number. Please ensure the number was encrypted using the correct Evervault App.
                    status: 400
                ParNotResolved:
                  summary: PAR Not Resolved
                  value:
                    code: invalid-request
                    title: Invalid Request
                    detail: The PAR could not be resolved for the provided card.
                    status: 400
        '403':
          description: 'The request was forbidden.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                DecryptionForbidden:
                  summary: Decryption Forbidden
                  value:
                    code: decrypt/forbidden
                    title: Forbidden Decryption
                    detail: Decryption of the provided card data is restricted by your current Data Policies. Please check and modify your policies, if needed, to enable decryption for PAR lookups.
                    status: 403
                FeatureNotEnabled:
                  summary: Feature Not Enabled
                  value:
                    code: forbidden
                    title: Forbidden
                    detail: The Card Insights feature is an Enterprise-only feature and is currently not enabled for your Evervault Production Apps. To enable this feature, please contact us at support@evervault.com. Alternatively, you can explore and test the feature in any Sandbox Apps.
                    status: 403
        '500':
          description: 'An error occurred while processing the request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  summary: Internal Server Error
                  value:
                    code: internal-server-error
                    title: Internal Server Error
                    detail: An internal server error occurred. For additional assistance, please contact support@evervault.com.
                    status: 500
  /payments/merchants:
    post:
      summary: Create a Merchant
      description: 'Enrolls a Merchant with Card Networks.


        In rare cases it can take up to 48 hours to enroll a merchant with each of the card networks. If you are still unable to provision network tokens after this period, please contact support@evervault.com'
      operationId: createMerchant
      tags:
      - Payments
      security:
      - ApiKey:
        - merchant:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: '**Must be globally unique. We recommend adding a suffix, for example `Acme 123456`. Onboarding may fail otherwise!**


                    The official name of the Merchant as recognized in transactions and communications. This name is used for display purposes and may be the company''s trade name or a derived nickname.

                    '
                  pattern: ^[a-zA-Z0-9 ]{1,60}$
                  example: Acme
                shortName:
                  type: string
                  description: 'A shorter version of the Merchant''s name. Optional. When creating a 3D Secure session that references this Merchant by ID, `shortName` is used in place of `name` if `name` exceeds the 40-character limit imposed by the 3D Secure specification.

                    '
                  pattern: ^[a-zA-Z0-9 ]{1,40}$
                  example: Acme
                website:
                  type: string
                  description: The official website URL of the Merchant. The domain must use a valid IANA top-level domain. See https://data.iana.org/TLD/tlds-alpha-by-domain.txt
                  pattern: "^(?:https?://[a-z0-9.-]+\\.[a-z]{2,63}|www\\d{0,3}\\.[a-z0-9.-]+\\.[a-z]{2,63}|[a-z0-9.-]+\\.[a-z]{2,63}/)(?:(?:[^\\s()<>:]+|\\((?:[^\\s()<>:]+|\\([^\\s()<>:]+\\))*\\))*(?:\\((?:[^\\s()<>:]+|\\([^\\s()<>:]+\\))*\\)|[^\\s`!()\\[\\]{};:'\".,<>?Â«Â»â€œâ€\x9Dâ€˜â€™:]))?$"
                  maxLength: 100
                  example: https://www.acme.com
                categoryCode:
                  type: string
                  description: The 4-digit Merchant Category Code (MCC).
                  example: '5945'
                business:
                  type: object
                  description: The business details of the Merchant.
                  properties:
                    legalName:
                      type: string
                      description: The legal name under which the Merchant's business is registered.
                      pattern: ^[a-zA-Z0-9 ]{1,60}$
                      example: Acme Corp
                    address:
                      $ref: '#/components/schemas/Address'
                      description: The physical address of the Merchant's principal place of business.
                  required:
                  - legalName
                  - address
                applePay:
                  type: object
                  description: The Merchant's Apple Pay configuration.
                  properties:
                    domains:
                      type: array
                      description: 'The domains the Merchant wants registered with Apple Pay. Only the domain name is required, without the protocol or path. For example, `example.com` is a valid domain, but `https://example.com` is not.

                        '
                      maxItems: 99
                      items:
                        type: string
                        example: ollivanders.co.uk
                  required:
                  - domains
                preChargebackAlerts:
                  allOf:
                  - $ref: '#/components/schemas/MerchantPreChargebackAlertsConfig'
                  description: 'The Merchant''s pre-chargeback alert enrolment configuration. At least one of `ethocaAlert` or `verifiRdr` must be provided.


                    Supplying this field additionally requires the `preChargebackAlert:create` grant.

                    '
              required:
              - name
              - website
              - categoryCode
              - business
            examples:
              SimpleExample:
                value:
                  name: Ollivanders Wand Shop
                  website: https://www.ollivanders.co.uk
                  categoryCode: '5945'
                  business:
                    legalName: Ollivanders Wand Shop Ltd
                    address:
                      line1: Diagon Alley
                      city: London
                      postalCode: WD1 1AA
                      country: gb
                  applePay:
                    domains:
                    - ollivanders.co.uk
      responses:
        '201':
          description: Returns a Merchant object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
              examples:
                SuccessfulCreation:
                  summary: Merchant successfully created
                  value:
                    id: merchant_eead1d640d7c
                    name: Ollivanders Wand Shop
                    website: https://www.ollivanders.co.uk
                    categoryCode: '5945'
                    business:
                      legalName: Ollivanders Wand Shop Ltd
                      address:
                        line1: Diagon Alley
                        city: London
                        postalCode: WD1 1AA
                        country: gb
                    networkTokens:
                      enrolment:
                      - cardBrand: mastercard
                        tokenRequestorIdentifier: '50165156978'
                        status: active
                      - cardBrand: visa
                        tokenRequestorIdentifier: '40238123804'
                        status: active
                      - cardBrand: american-express
                        tokenRequestorIdentifier: null
                        status: inactive
                    applePay:
                      domains:
                      - merchantUuid: merchant_eead1d640d7c
                        domain: ollivanders.co.uk
                        status: pending
                    createdAt: 1692972623233
                    updatedAt: 1692972623768
    get:
      x-section: Payments
      x-group: Merchants
      summary: List Merchants
      description: Lists all Merchants that have been created.
      operationId: listMerchants
      tags:
      - Payments
      security:
      - ApiKey:
        - merchant:read
      parameters:
      - name: page
        in: query
        description: The page number to retrieve.
        required: false
        schema:
          type: integer
          default: 0
      - name: pageSize
        in: query
        description: The number of Merchants to retrieve per page (default is 50).
        required: false
        schema:
          type: integer
          default: 50
      - name: q
        in: query
        description: Filter the Merchants by name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Returns a list of Merchant objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Merchant'
                  pageSize:
                    type: integer
                    description: The number of Merchants retrieved per page.
                  nextPage:
                    type:
                    - integer
                    - 'null'
                    description: The next page number to retrieve. If there are no additional Merchants, this will be `null`.
                  total:
                    type: integer
                    description: The total count of all Merchants, after any filters.
                required:
                - data
                - pageSize
                - nextPage
                - total
              examples:
                SuccessfulCreation:
                  summary: Successful List
                  description: The Merchants were retrieved successfully.
                  value:
                    data:
                    - id: merchant_eead1d640d7c
                      name: Ollivanders Wand Shop
                      website: https://www.ollivanders.co.uk
                      categoryCode: '5945'
                      business:
                        legalName: Ollivanders Wand Shop Ltd
                        address:
                          line1: Diagon Alley
                          city: London
                          postalCode: WD1 1AA
                          country: gb
                      networkTokens:
                        enrolment:
                        - cardBrand: mastercard
                          tokenRequestorIdentifier: '50165156978'
                          status: active
                        - cardBrand: visa
                          tokenRequestorIdentifier: '40238123804'
                          status: active
                        - cardBrand: american-express
                          tokenRequestorIdentifier: null
                          status: inactive
                      applePay:
                        domains:
                        - merchantUuid: merchant_eead1d640d7c
                          domain: ollivanders.co.uk
                          status: active
                      createdAt: 1692972623233
                      updatedAt: 1692972623768
                    pageSize: 50
                    nextPage: null
                    total: 1
  /payments/merchants/{merchant_id}:
    get:
      x-section: Payments
      x-group: Merchants
      summary: Retrieve a Merchant
      description: Retrieves a Merchant by its unique identifier.
      operationId: getMerchant
      tags:
      - Payments
      security:
      - ApiKey:
        - merchant:read
      parameters:
      - name: merchant_id
        in: path
        description: The unique identifier of the merchant.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a Merchant object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
              examples:
                SuccessfulCreation:
                  summary: Merchant successfully created
                  value:
                    id: merchant_eead1d640d7c
                    name: Ollivanders Wand Shop
                    website: https://www.ollivanders.co.uk
                    categoryCode: '5945'
                    business:
                      legalName: Ollivanders Wand Shop Ltd.
                      address:
                        line1: Diagon Alley
                        city: London
                        postalCode: WD1 1AA
                        country: gb
                    networkTokens:
                      enrolment:
                      - cardBrand: mastercard
                        tokenRequestorIdentifier: '50165156978'
                        status: active
                      - cardBrand: visa
                        tokenRequestorIdentifier: '40238123804'
                        status: active
                      - cardBrand: american-express
                        tokenRequestorIdentifier: null
                        status: inactive
                    applePay:
                      domains:
                      - merchantUuid: merchant_eead1d640d7c
                        domain: ollivanders.co.uk
                        status: active
                    createdAt: 1692972623233
                    updatedAt: 1692972623768
    patch:
      x-section: Payments
      x-group: Merchants
      summary: Update a Merchant
      description: Updates a Merchant by its unique identifier.
      operationId: updateMerchant
      tags:
      - Payments
      security:
      - ApiKey:
        - merchant:update
      parameters:
      - name: merchant_id
        in: path
        description: The id of the Merchant to be updated.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shortName:
                  type: string
                  description: 'A shorter version of the Merchant''s name. When creating a 3D Secure session that references this Merchant by ID, `shortName` is used in place of `name` if `name` exceeds the 40-character limit imposed by the 3D Secure specification.

                    '
                  pattern: ^[a-zA-Z0-9 ]{1,40}$
                  example: Acme
                applePay:
                  type: object
                  description: The Merchant's Apple Pay configuration.
                  properties:
                    domains:
                      type: array
                      description: 'The domains the Merchant wants registered with Apple Pay. To remove a domain previously registered with Apple Pay, exclude it from the list. Only the domain name is required, without the protocol or path. For example, `example.com` is a valid domain, but `https://example.com` is not.

                        '
                      items:
                        type: string
                        example: ollivanders.co.uk
                preChargebackAlerts:
