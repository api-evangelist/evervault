  /payments/cards/subscriptions/{subscription_id}/simulate:
    post:
      summary: Simulate an Account Updater Subscription update
      description: 'Simulate an asynchronous update for a subscribed card so you can test your webhook

        integration without waiting for a real push from the card networks. First

        subscribe a card using the test card

        `4242424242424242`, then call this endpoint with the `type` of update you want to

        simulate.


        Evervault delivers a `real-time.card.updated` webhook to

        your registered endpoint, identical to a production push. The card networks only push

        a subset of results asynchronously, so this endpoint accepts only the update types that

        can arrive over a webhook.


        Updates can only be simulated for a subscription to `4242424242424242`. A

        `new-account-number` update returns `4111111111111111` as the replacement card,

        as an Evervault encrypted string.


        This endpoint is only available to Sandbox apps.'
      operationId: simulateAccountUpdaterSubscription
      tags:
      - Payments
      security:
      - ApiKey:
        - card:subscriptions
      parameters:
      - name: subscription_id
        in: path
        required: true
        description: The identifier of the subscription to simulate an update for.
        schema:
          type: string
        example: aus_8da9a7fbde01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: The update to simulate. Accepts only the updates the card networks push asynchronously.
                  enum:
                  - new-account-number
                  - new-expiry-date
                  - account-closed
                  example: new-expiry-date
              required:
              - type
