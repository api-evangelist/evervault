          description: 'When true, indicates that instant payments are supported for international

            transactions between different countries. This enables immediate funds

            availability for cross-border transfers.

            '
    AccountUpdaterSubscription:
      type: object
      description: A subscription that receives real-time card account updates for a registered card number, via webhook, as they become available from the card networks.
      properties:
        id:
          type: string
          description: The unique identifier for the subscription.
          example: aus_8da9a7fbde01
        status:
          type: string
          description: The status of the subscription.
          enum:
          - active
          - canceled
          example: active
        createdAt:
          type: integer
          description: The time the subscription was created, in milliseconds since the Unix epoch.
          example: 1709293284000
      required:
      - id
      - status
      - createdAt
    MerchantPreChargebackAlerts:
      type: object
      summary: Merchant Pre-Chargeback Alerts
      description: 'The Merchant''s pre-chargeback alert enrolments, returned on Merchant responses when

        pre-chargeback alerts have been configured.

        '
      properties:
        enrolments:
          type: array
          description: The merchant's enrolments with Ethoca and/or Verifi RDR.
          items:
            type: object
            properties:
              type:
                type: string
                description: The enrolment network.
                enum:
                - ETHOCA_ALERT
                - VERIFI_RDR
                example: ETHOCA_ALERT
              status:
                type: string
                description: 'The enrolment status. It can take 2–10 days to move from `PENDING` to `ACTIVE`.

                  '
                enum:
                - PENDING
                - ACTIVE
                - ACTION_REQUIRED
                - CANCELLED
                example: PENDING
              ethocaAlert:
                type: object
                description: Ethoca alert enrolment details. Present when `type` is `ETHOCA_ALERT`.
                properties:
                  descriptors:
                    type: array
                    description: The billing descriptors enrolled for Ethoca alerts.
                    items:
                      type: object
                      properties:
                        descriptor:
                          type: string
                          description: The billing descriptor matched against transactions.
                          example: EXAMPLE STORE
                        matchType:
                          type: string
                          description: How the descriptor is matched against transactions.
                          enum:
                          - STARTS_WITH
                          - EXACT_MATCH
                          example: EXACT_MATCH
                        status:
                          type: string
                          description: The descriptor enrolment status.
                          example: PENDING
                      required:
                      - descriptor
                      - matchType
              verifiRdr:
                type: object
                description: Verifi RDR enrolment details. Present when `type` is `VERIFI_RDR`.
                properties:
                  bin:
                    type: string
                    description: The Bank Identification Number (BIN) associated with the Merchant. Must be exactly 6 digits.
                    example: '424242'
                  caid:
                    type: string
                    description: The Card Acceptor ID (CAID) associated with the Merchant. Must be exactly 15 alphanumeric characters.
                    example: '123456789012345'
                  arns:
                    type: array
                    description: The Acquirer Reference Numbers (ARNs) enrolled.
                    items:
                      type: string
                      example: '12345678901234567890123'
            required:
            - type
            - status
      required:
      - enrolments
      example:
        enrolments:
        - type: ETHOCA_ALERT
          status: PENDING
          ethocaAlert:
            descriptors:
            - descriptor: EXAMPLE STORE
              matchType: EXACT_MATCH
              status: PENDING
    AccountUpdaterCheck:
      type: object
      description: The result of pulling the latest details for a card from the card networks.
      properties:
        id:
          type: string
          description: The unique identifier for the check.
          example: auc_8da9a7fbde01
        result:
          type: string
          description: 'The outcome of the check. Only `new-expiry-date` and `new-account-number` carry an `update` payload; every other result returns no new credentials.

            '
          enum:
          - no-change
          - new-expiry-date
          - new-account-number
          - account-closed
          - contact-cardholder
          - cardholder-opt-out
          - merchant-opt-out
          - no-match
          example: new-account-number
        update:
          type:
          - object
          - 'null'
          description: 'The updated card details. Present on `new-account-number` and `new-expiry-date` results, and `null` on every other result.

            '
          properties:
            card:
              type: object
              description: The updated card details.
              properties:
                number:
                  type: string
                  description: 'The updated card number. Always an Evervault encrypted string, and only present on a `new-account-number` result. The plaintext card number is never returned, so decrypt this value with Evervault if you need the plaintext account number.

                    '
                  example: ev:debug:Tk9D:number:nTepvAI585M7lUVp:AkJ6Brzat0E7ui8DSKCSXO7AopU/+GFuBekQ6cGx7eTl:sfihK53itmHp+URxomnTITUpwQwM5nnRrnQ0qdIOUlA=:$
                expiry:
                  allOf:
                  - $ref: '#/components/schemas/CardExpiry'
                  description: The updated expiry date. Present on `new-account-number` and `new-expiry-date` results.
      required:
      - id
      - result
      - update
    CardBrand:
