                value:
                  type: new-account-number
              AccountClosedExample:
                summary: Simulate a closed account
                value:
                  type: account-closed
      responses:
        '202':
          description: 'The simulated update was accepted and a `real-time.card.updated` webhook will be

            delivered to your registered endpoint. The body describes the update that was

            dispatched.

