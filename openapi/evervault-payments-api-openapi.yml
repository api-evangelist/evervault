            type: credit
            regulated: true
            currency:
              alphaCode: usd
              numericCode: '840'
            country:
              alphaCode: us
              numericCode: '840'
        fees: null
        cvv:
          code: match
          value: M
        email:
          value: '1'
          code: match
        phone:
          value: '1'
          code: match
        address:
          networkIdentifier: '1234567890'
          networkResponseCode:
            code: null
            value: '85'
          result:
            value: Y
            address: match
            zip: match
        cardholder:
          result:
            value: M
            code: match-performed
          fullName:
            value: M
            code: match
          firstName:
            value: M
            code: match
          lastName:
            value: M
            code: match
        paymentAccountReference: V0010011111111111111111111111
        createdAt: 169297262323
