    PreChargebackAlert:
      type: object
      summary: The Pre-Chargeback Alert Object
      description: 'A pre-chargeback alert received from Ethoca or Verifi RDR.

        '
      properties:
        id:
          type: string
          description: A unique identifier for the alert.
          example: pre_chargeback_alert_eead1d640d7c
        merchantId:
          type: string
          description: The Evervault Merchant ID associated with the alert.
          example: merchant_eead1d640d7c
        alertType:
          type: string
          description: The alert network that originated the alert.
          enum:
          - ETHOCA_ALERT
          - VERIFI_RDR
          example: ETHOCA_ALERT
        alertNetworkId:
          type:
          - string
          - 'null'
          description: The alert identifier from the alert network.
          example: '1234567890'
        status:
          type: string
          description: 'The current status of the alert. `ACTION_REQUIRED` only applies to Ethoca alerts.

            '
          enum:
          - ACTION_REQUIRED
          - RESOLVED
          - INVALID
          example: ACTION_REQUIRED
        chargebackReasonCode:
          type:
          - string
          - 'null'
          description: The reason code identifying why the dispute was raised.
          example: '10.4'
        transactionAmountInCents:
          type:
          - integer
          - 'null'
          format: int64
          description: The disputed transaction amount in cents.
          example: 4999
        transactionCurrencyCode:
          type:
          - string
          - 'null'
          description: The ISO 4217 currency code of the disputed transaction.
          example: USD
        transactionAuthorizedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the transaction was authorized, as an ISO 8601 timestamp in UTC.
          example: '2025-02-10T10:30:00Z'
        actionRequiredDeadline:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The deadline by which an Ethoca alert must be actioned. After this time the chargeback

            proceeds regardless of whether you refunded the customer.

            '
          example: '2025-02-17T10:30:00Z'
        transactionAuthorizationCode:
          type:
          - string
          - 'null'
          description: The authorization code for the disputed transaction.
          example: ABC123
        transactionAcquirerReferenceNumber:
          type:
          - string
          - 'null'
          description: 'The Acquirer Reference Number (ARN). Useful when communicating with your PSP to identify

            the transaction.

            '
          example: '74027012345678901234567'
        transactionStatementDescriptor:
          type:
          - string
          - 'null'
          description: The descriptor that appeared on the cardholder's statement.
          example: EXAMPLE STORE
        transactionCardBin:
          type:
          - string
          - 'null'
          description: The first 6–11 digits of the card number. Also included in `card.bin`.
          example: '424242'
        card:
          type:
          - object
          - 'null'
          description: Card details for the disputed transaction, when available.
          properties:
            bin:
              type:
              - string
              - 'null'
              description: The BIN/IIN of the card.
              example: '424242'
            lastFour:
              type:
              - string
              - 'null'
              description: The last four digits of the card number.
              example: '4242'
            brand:
              type:
              - string
              - 'null'
              description: The card scheme (for example `VISA` or `MASTERCARD`).
              example: VISA
            issuer:
              type:
              - string
              - 'null'
              description: The issuing bank name.
              example: Example Bank
        transactionRefundOutcome:
          type:
          - string
          - 'null'
          description: 'Populated when a refund outcome is known. For Verifi RDR, this is set automatically.

            '
          enum:
          - REFUNDED
          - NOT_REFUNDED
          - null
          example: null
        transactionNetworkId:
          type:
          - string
          - 'null'
          description: The network transaction identifier, when available.
          example: null
        subscriptionCancelOutcome:
          type:
          - string
          - 'null'
          description: The outcome of a subscription cancellation, when available.
          example: null
        note:
          type:
          - string
          - 'null'
          description: An optional note stored with the alert for your own records.
          example: Customer requested immediate review
        integrationId:
          type:
          - string
          - 'null'
          description: An optional integration identifier associated with the alert.
          example: null
        integrationTransactionId:
          type:
          - string
          - 'null'
          description: An optional integration transaction identifier associated with the alert.
          example: null
        createdAt:
          type: string
          format: date-time
          description: When the alert was created, as an ISO 8601 timestamp in UTC.
          example: '2025-02-11T10:30:00Z'
      required:
      - id
      - merchantId
      - alertType
      - status
      - createdAt
      example:
        id: pre_chargeback_alert_eead1d640d7c
        merchantId: merchant_eead1d640d7c
        alertType: ETHOCA_ALERT
        alertNetworkId: '1234567890'
        status: ACTION_REQUIRED
        chargebackReasonCode: '10.4'
        transactionAmountInCents: 4999
        transactionCurrencyCode: USD
        transactionAuthorizedAt: '2025-02-10T10:30:00Z'
        actionRequiredDeadline: '2025-02-17T10:30:00Z'
        transactionAuthorizationCode: ABC123
        transactionAcquirerReferenceNumber: '74027012345678901234567'
        transactionStatementDescriptor: EXAMPLE STORE
        transactionCardBin: '424242'
        card:
          bin: '424242'
          lastFour: '4242'
          brand: VISA
          issuer: Example Bank
        transactionRefundOutcome: null
        transactionNetworkId: null
        subscriptionCancelOutcome: null
        note: Customer requested immediate review
        integrationId: null
        integrationTransactionId: null
        createdAt: '2025-02-11T10:30:00Z'
