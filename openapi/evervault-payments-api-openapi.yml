            productName:
              type: string
              description: The name of the product associated with the card
              example: Visa Debit
            fastFunds:
              $ref: '#/components/schemas/CardFastFunds'
            matchPrecision:
              type: number
              description: Indicates how many leading digits of the submitted BIN are confirmed by the matched data. A higher value means a more specific match. When multiple matches are found, the value represents the least precise BIN range the submitted BIN could belong to.
              example: 8
            threeDS:
              $ref: '#/components/schemas/CardThreeDSMetadata'
        capabilities:
          type: object
          description: The push and pull capabilities of the card
