              examples:
                Created:
                  summary: Subscription created
                  value:
                    id: aus_8da9a7fbde01
                    status: active
                    createdAt: 1709293284000
        '400':
          description: 'The request was invalid or cannot be otherwise served.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidRequest:
                  summary: Invalid request
                  value:
                    status: 400
                    code: invalid-request
                    title: Invalid request
                    detail: 'A malformed expiry, missing field, or bad ev: ciphertext was provided.'
                UnsupportedCardBrand:
                  summary: Unsupported card brand
                  value:
                    status: 400
                    code: invalid-request
                    title: Invalid request
                    detail: 'Unsupported card brand: only Visa and Mastercard cards are supported for real-time account updates.'
        '401':
          description: 'The request cannot be authenticated.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    status: 401
                    code: unauthorized
                    title: Unauthorized
