      - $ref: '#/components/schemas/PreChargebackAlertsEnrolmentInput'
      - type: object
        properties:
          enabled:
            type: boolean
            description: 'Set to `false` to disable pre-chargeback alerts for the merchant and unenrol them.

              Omitting this field (or setting it to `true`) enrols or re-enrols the merchant.

              '
            example: true
    Error:
      type: object
      properties:
        code:
          type: string
