                            - work
                            example: mobile
                          countryCode:
                            type: string
                            description: The numerical country calling code of the phone number.
                            example: '353'
                          number:
                            type: string
                            description: The phone number of the customer.
                            example: '873451276'
                        required:
                        - type
                        - countryCode
                        - number
                    email:
                      type: string
                      format: email
                      description: The email address of the customer.
                      example: seamus@hogwarts.edu
                    shipping:
