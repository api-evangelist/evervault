      x-group: Pre-Chargeback Alerts
      summary: Update a Pre-Chargeback Alert
      description: 'Updates an Ethoca alert after you have taken action with your PSP.


        Both fields are optional: `action` notifies Ethoca of the action you took and is what

        prevents the chargeback from proceeding — omitting it means Ethoca is not notified.

        `note` is purely informational and is stored for your own records only; it is not sent

        to Ethoca.


        Once actioned, the alert moves to `RESOLVED` status. Alerts that are already `RESOLVED`

        cannot be actioned again.'
      operationId: updatePreChargebackAlert
      tags:
