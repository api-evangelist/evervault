              type: string
              description: The name of the merchant.
              example: Ollivanders Wand Shop
            website:
              type: string
              description: The website of the merchant.
              example: https://www.ollivanders.co.uk
            categoryCode:
              type: string
              description: The category code of the merchant.
              example: '5945'
            country:
              type: string
              format: iso-3166-1-alpha-2
              description: The country code of the merchant.
              example: ie
          required:
          - name
          - website
          - categoryCode
          - country
        payment:
          type: object
          description: The payment details of the 3D Secure Authentication.
          oneOf:
          - $ref: '#/components/schemas/PaymentInstallment'
          - $ref: '#/components/schemas/PaymentOneOff'
          - $ref: '#/components/schemas/PaymentRecurring'
        challenge:
          $ref: '#/components/schemas/ThreeDSChallenge'
        initiator:
          $ref: '#/components/schemas/ThreeDSInitiator'
        accessControlServer:
          $ref: '#/components/schemas/ThreeDSAccessControlServer'
        directoryServer:
          $ref: '#/components/schemas/ThreeDSDirectoryServer'
        threeDSServer:
          type: object
          description: Details about the 3DS Server involved in the 3DS transaction.
          properties:
            transactionIdentifier:
              type: string
              description: The unique identifier for the 3DS transaction.
              example: a623edc1-54bc-455d-9dea-c909783a37c3
        version:
          type: string
          enum:
          - 2.2.0
          description: The 3D Secure version used to authenticate the session.
          example: 2.2.0
        status:
          type: string
          enum:
          - action-required
          - success
          - failure
          description: The status of the 3DS Authentication.
          example: action-required
        authentication:
          type: object
          description: The details of the 3DS Authentication. This field is present when the status is `success`.
          properties:
            flow:
              type: string
              enum:
              - frictionless
              - challenge
              - attempt
              description: The authentication flow.
              example: frictionless
            methods:
              type: array
              items:
                type: string
                enum:
                - static-passcode
                - sms-otp
                - emv-card-reader-otp
                - app-otp
                - other-otp
                - knowledge-based
                - push-confirmation
                - oob-biometrics
                - oob-login
                - oob-other
                - webauthn
                - secure-payment-confirmation
                - behavioral-biometrics
                - electronic
                - decoupled
              description: The authentication method(s). This field is only present when the flow is `challenge`.
              example:
              - sms-otp
              - push-confirmation
          required:
          - flow
        nextAction:
          type: object
          description: The next action required to complete the 3DS Authentication.
          properties:
            type:
              type: string
              description: 'The next action required to progress the 3DS Authentication. If the type is `use-sdk` you must use our [Client-Side SDK](/sdks/javascript#ui.threedsecure()) to complete the 3DS Authentication.

                '
              enum:
              - use-sdk
              example: use-sdk
          required:
          - type
        cryptogram:
          type: string
          description: The 3DS cryptogram (also called Authentication Value). This value must be retrieved and provided to the payment gateway when processing the payment. This value is only present when the status is `success` and is retained for one hour.
          example: MTIzNDU2Nzg5MDA5ODc2NTQzMjE=
        eci:
          type: object
          description: The details of the Electronic Commerce Indicator. This value is only present when the status is `success`.
          properties:
            value:
              type: string
              enum:
              - '00'
              - '01'
              - '02'
              - '04'
              - '05'
              - '06'
              - '07'
              description: "The value of the ECI. Below are descriptions of each of the possible values:\n\nMastercard:\n  - `00`: Not authenticated. No liability shift.\n  - `01`: Attempted (Stand-in) authentication. Liability shift applies.\n  - `02`: Successful authentication. Liability shift applies.\n  - `04`: Data only authentication. No liability shift.\n  - `06`: Transaction is exempt from SCA. No liability shift.\n  - `07`: Recurring transaction authenticated. Liability shift applies for initial transaction only.\n\nVisa, American Express, Discover, Diners Club, JCB:\n  - `05`: Successful authentication. Liability shift applies.\n  - `06`: Attempted (Stand-in) authentication. Liability shift applies.\n  - `07`: Not authenticated. No liability shift.\n"
              example: '05'
            descriptor:
              type: string
              enum:
              - fully-authenticated
              - attempted
              - not-authenticated
              description: The descriptor of the ECI. This value must be retrieved and provided to the payment gateway when processing the payment.
              example: fully-authenticated
            liabilityShift:
              type: boolean
              description: A boolean value indicating whether the liability shift has occurred.
              example: true
        failureReason:
          type: string
          enum:
          - failed-authentication
          - card-not-enrolled
          - no-card-record
          - suspected-fraud
          - invalid-acquirer-details
          - cancelled
          - unsupported-version
          - challenge-required
          - authentication-timed-out
          - acs-unavailable
          - directory-server-unavailable
          - transient-system-failure
          - invalid-card-details
          - transaction-not-permitted
          - required-data-element-missing
          - protocol-error
          x-enum-description:
            failed-authentication: The authentication failed. Typically this is due to the cardholder failing to provide the correct 3DS authentication details. This transaction should be considered as potentially fraudulent.
            card-not-enrolled: The card is not enrolled in 3DS and therefore cannot be authenticated.
            no-card-record: The issuer has no record of the card. Verify the card details with the cardholder before retrying.
            suspected-fraud: The transaction is suspected to be fraudulent. You should not process this transaction.
            invalid-acquirer-details: The acquirer details are invalid. Please check the `acquirer` object for the correct details.
            cancelled: The cardholder cancelled the transaction.
            unsupported-version: The 3DS version is not supported.
            challenge-required: This failure mode indicates that the cardholder is required to complete a challenge but the SDK has been mounted with the `failOnChallenge` option set to `true`.
            authentication-timed-out: The authentication timed out. This is likely because the cardholder abandoned the transaction.
            acs-unavailable: The Access Control Server associated with the card issuer was unavailable. Please try again later.
            directory-server-unavailable: The Directory Server associated with the card network was unavailable. Please try again later.
            transient-system-failure: A transient system failure occurred. This is likely due to a technical issue with the 3DS authentication process. Please try again later.
            invalid-card-details: The card details are invalid. Please check the `card` object for the correct details and ensure the card is not expired.
            transaction-not-permitted: The current session configuration is not permitted for this card. For example, defining a merchant intiated transaction reason of `secure-corporate-payment` for non-commercial cards.
            required-data-element-missing: A required data element is missing. Please check the `card` object for the correct details and ensure all required data elements are present.
            protocol-error: A protocol error occurred. This is likely due to a technical issue with the 3DS authentication process. Please try again later.
          description: 'The reason for the 3DS Authentication failure. This field is present when the status is `failure` and can be used for troubleshooting.

            '
        ares:
          type: object
          description: The details of the 3DS Authentication Response (ARes).
          properties:
            transStatus:
              type: object
              description: The transaction status.
              properties:
                value:
                  type: string
                  enum:
                  - Y
                  - N
                  - U
                  - A
                  - C
                  - D
                  - R
                  - I
                  description: The raw value of the transaction status.
                  example: Y
                detail:
                  type: string
                  description: The detailed description of the transaction status.
                  example: Authentication/Account Verification Successful
            transStatusReason:
              type:
              - 'null'
              - object
              description: The reason for the transaction status if transStatus is 'N', 'U' or 'R'.
              properties:
                value:
                  type: string
                  description: The raw value of the transaction status reason.
                  example: '11'
                detail:
                  type: string
                  description: The detailed description of the transaction status reason.
                  example: Suspected fraud
            cardholderInfo:
              type:
              - 'null'
              - string
              description: A message from the card issuer to display to the cardholder, such as guidance to contact their bank. Maximum 128 characters.
              example: Please contact your bank.
        cres:
          type:
          - 'null'
          - object
          description: The details of the 3DS Challenge Response (CRes).
          properties:
            transStatus:
              type: object
              description: The transaction status.
              properties:
                value:
                  type: string
                  enum:
                  - Y
                  - N
                  description: The raw value of the transaction status.
                  example: Y
                detail:
                  type: string
                  description: The detailed description of the transaction status.
                  example: Authentication/Account Verification Successful
        rreq:
          type:
          - 'null'
          - object
          description: The result of the 3DS authentication when a challenge has occurred.
          properties:
            transStatus:
              type: object
              description: The transaction status.
              properties:
                value:
                  type: string
                  enum:
                  - Y
                  - N
                  - U
                  - A
                  - R
                  description: The raw value of the transaction status.
                  example: Y
                detail:
                  type: string
                  description: 'The detailed description of the transaction status. Below are descriptions of each of the possible values:

                    - `Y` - Authentication Verification Successful.

                    - `N` - Not Authenticated/Account Not Verified; Transaction denied.

                    - `U` - Authentication/Account Verification Could Not Be Performed; Technical or other problem.

                    - `A` - Attempts Processing Performed; Not Authenticated/Verified, but a proof of attempted authentication/verification is provided.

                    - `R` - Authentication/Account Verification Rejected; Issuer is rejecting.'
                  example: Authentication Verification Successful.
        dcap:
          $ref: '#/components/schemas/ThreeDSDcap'
        externalCustomerReference:
          type: string
          description: The identifier you provided when creating the 3DS Session. Only present if one was provided.
          example: order_8f2a1c
        createdAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this 3DS-Session was created.
          example: 1692972623233
        updatedAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this 3DS-Session was last updated.
          example: 1692972623768
      required:
      - id
      - merchant
      - card
      - acquirer
      - version
      - status
      - createdAt
    PaymentOneOff:
      type: object
      summary: One-Off Payment
      description: A payment that is made in a single transaction.
      properties:
        type:
          type: string
          description: The value `one-off`.
          enum:
          - one-off
          example: one-off
        amount:
          type: integer
          description: The amount of the payment in the smallest currency unit (e.g. cents).
          example: 1000
        currency:
          type: string
          format: iso-4217-alphabetic
          description: The currency of the payment.
          example: gbp
      required:
      - type
      - amount
      - currency
    CauAclUpdate:
      type: object
      description: Account closure
      properties:
        updateType:
          type: string
          description: The type of update to simulate.
          enum:
          - account-closure
      required:
      - updateType
    CardFunding:
      type: string
      enum:
      - debit
      - credit
      - prepaid
      - deferred-debit
      - charge
      x-enum-description:
        debit: Draw funds directly from a linked bank account
        credit: Provide a line of credit from which users can borrow funds for transactions
        prepaid: Loaded with a set amount of funds in advance and can be used until the balance is depleted
        deferred-debit: Combine aspects of debit and credit cards, allowing transactions to be debited from a linked account at a later date, usually monthly
        charge: Require full payment of the balance at the end of each billing cycle, but do not have a pre-set spending limit
      description: 'The card funding type specifies the method by which transactions are

        financed.

        '
      example: debit
    Merchant:
      type: object
      summary: The Merchant Object
      properties:
        id:
          type: string
          description: A unique identifier assigned to each Merchant.
          example: merchant_eead1d640d7c
        name:
          type: string
          description: '**Must be globally unique. We recommend adding a suffix, for example `Acme 123456`.**


            The official name of the Merchant as recognized in transactions and communications. This name is used for display purposes and may be the company''s trade name or a derived nickname.'
          pattern: ^[a-zA-Z0-9 ]{1,60}$
          example: Acme
        shortName:
          type: string
          description: 'A shorter version of the Merchant''s name. When creating a 3D Secure session that references this Merchant by ID, `shortName` is used in place of `name` if `name` exceeds the 40-character limit imposed by the 3D Secure specification.

            '
          pattern: ^[a-zA-Z0-9 ]{1,40}$
          example: Acme
        website:
          type: string
          description: The official website URL of the Merchant. The domain must use a valid IANA top-level domain. See https://data.iana.org/TLD/tlds-alpha-by-domain.txt
          example: https://www.acme.com
        business:
          type: object
          description: The business details of the Merchant.
          properties:
            legalName:
              type: string
              description: The legal name under which the Merchant's business is registered.
              pattern: ^[a-zA-Z0-9 ]{1,60}$
              example: Acme Corp
            address:
              $ref: '#/components/schemas/Address'
              description: The physical address of the Merchant's principal place of business.
          required:
          - legalName
          - address
        categoryCode:
          type: string
          description: The 4-digit Merchant Category Code (MCC).
          example: '5945'
        networkTokens:
          $ref: '#/components/schemas/MerchantNetworkTokenStatus'
          description: The Merchant's Network Token configuration.
        applePay:
          $ref: '#/components/schemas/MerchantApplePay'
          description: The Merchant's Apple Pay configuration.
        preChargebackAlerts:
          $ref: '#/components/schemas/MerchantPreChargebackAlerts'
          description: The Merchant's pre-chargeback alert enrolments, when configured.
        createdAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this Merchant was created.
          example: 1692972623233
        updatedAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this Merchant was last updated.
          example: 1692972623768
      required:
      - id
      - name
      - website
      - categoryCode
      - business
      - networkTokens
      - applePay
      - createdAt
      example:
        id: merchant_eead1d640d7c
        name: Ollivanders Wand Shop
        website: https://www.ollivanders.co.uk
        categoryCode: '5945'
        business:
          legalName: Ollivanders Wand Shop Ltd
          address:
            line1: Diagon Alley
            city: London
            postalCode: WD1 1AA
            country: gb
        networkTokens:
          enrolment:
          - cardBrand: mastercard
            tokenRequestorIdentifier: '50165156978'
            status: active
          - cardBrand: visa
            tokenRequestorIdentifier: '40238123804'
            status: active
          - cardBrand: american-express
            tokenRequestorIdentifier: null
            status: inactive
        applePay:
          domains:
          - merchantUuid: merchant_eead1d640d7c
            domain: store.ollivanders.co.uk
            status: active
        createdAt: 1692972623233
        updatedAt: 1692972623768
    AcquirerConfiguration:
      type: object
      summary: The Acquirer Object
      properties:
        id:
          type: string
          description: The unique identifier of the acquirer configuration.
          example: acquirer_eead1d640d7c
        name:
          type: string
          description: The name of the acquirer configuration.
        description:
          type: string
          description: The description of the acquirer configuration.
        default:
          type: boolean
        configurations:
          type: array
          description: The acquirer configuration settings.
          items:
            type: object
            properties:
              network:
                type: string
                enum:
                - visa
                - mastercard
                - american-express
                - discover
                - jcb
                - unionpay
                example: mastercard
                description: The card network of the Acquirer. `discover` covers Discover and Diners Club.
              bin:
                type: string
                pattern: ^[0-9]{6,11}$
                minLength: 6
                maxLength: 11
                example: '424242'
                description: The Bank Identification Number (BIN) of the Acquirer. Must be 6 to 11 digits.
              acquirerMerchantIdentifier:
                type: string
                description: The merchant identifier the configuration is associated with.
                example: '38191048173'
              state:
                type: string
                example: active
              country:
                description: The country of the acquirer configuration, used when creating 3DS sessions.
                type: string
                format: iso-3166-1-alpha-2
                example: ie
            required:
            - network
            - bin
            - acquirerMerchantIdentifier
            - state
            - country
      required:
      - id
      - name
      - default
      - configurations
      example:
        id: acquirer_eead1d640d7c
        name: Ollivanders Wand Shop Production Configuration
        description: Ollivanders Wand Shop Production Configuration
        default: true
        configurations:
        - network: mastercard
          bin: '424242'
          acquirerMerchantIdentifier: '38191048173'
          state: active
          country: ie
        - network: visa
          bin: '424242'
          acquirerMerchantIdentifier: '38191048173'
          state: active
          country: ie
    RealTimeAccountUpdate:
      type: object
      description: A real-time card account update pushed by the card networks for a subscription. Push updates fire only for actual changes.
      properties:
        subscription:
          type: string
          description: The identifier of the subscription this update belongs to.
          example: aus_8da9a7fbde01
        result:
          type: string
          description: 'The type of update pushed by the card networks. Push updates fire only when there is an actual change, so `no-change`, `no-match`, `contact-cardholder`, and opt-out results never appear here.

            '
          enum:
          - new-account-number
          - new-expiry-date
          - account-closed
          example: new-account-number
        update:
          type:
          - object
          - 'null'
          description: 'The updated card details. Present on `new-account-number` and `new-expiry-date` results, and `null` on `account-closed`.

            '
          properties:
            card:
              type: object
              description: The updated card details.
              properties:
                number:
                  type: string
                  description: 'The updated card number. Always an Evervault encrypted string, and only present on a `new-account-number` result. The plaintext card number is never returned, so decrypt this value with Evervault if you need the plaintext account number.

                    '
                  example: ev:debug:Tk9D:number:nTepvAI585M7lUVp:AkJ6Brzat0E7ui8DSKCSXO7AopU/+GFuBekQ6cGx7eTl:sfihK53itmHp+URxomnTITUpwQwM5nnRrnQ0qdIOUlA=:$
                expiry:
                  allOf:
                  - $ref: '#/components/schemas/CardExpiry'
                  description: The updated expiry date. Present on `new-account-number` and `new-expiry-date` results.
      required:
      - subscription
      - result
      - update
    CardSegment:
      type: string
