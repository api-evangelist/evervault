            code:
              type: string
              description: A human readable version of the email match code
              enum:
              - match
              - no-match
              - not-performed
              - unable-to-verify
              example: match
          required:
          - value
          - code
        phone:
          type: object
          description: The result of the phone verification check
          properties:
            value:
              type: string
              description: The raw match code returned from the phone verification check
              enum:
              - '1'
              - '2'
              - '3'
              - U
              example: '1'
            code:
              type: string
              description: A human readable version of the phone match code
              enum:
              - match
              - no-match
              - not-performed
              - unable-to-verify
              example: match
          required:
          - value
          - code
        paymentAccountReference:
          type: string
          description: The unique identifier of the Payment Account associated with this card.
          example: 512381d9f8e0629211e3949a08002
        createdAt:
          type: integer
          description: Unix timestamp of when the card insight was created
          example: 169297262323
      required:
