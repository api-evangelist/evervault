  /payments/pre-chargeback-alerts/alerts:
    get:
      x-section: Payments
      x-group: Pre-Chargeback Alerts
      summary: List Pre-Chargeback Alerts
      description: 'Returns a paginated list of pre-chargeback alerts for your app.


        Unknown query parameters are rejected with a `400`.'
      operationId: listPreChargebackAlerts
      tags:
      - Payments
      security:
      - ApiKey:
        - preChargebackAlert:read
      parameters:
      - name: status
        in: query
        description: Filter by alert status.
        required: false
        schema:
          type: string
          enum:
          - ACTION_REQUIRED
          - RESOLVED
          - INVALID
      - name: merchantId
        in: query
        description: Filter by Evervault Merchant ID.
        required: false
        schema:
          type: string
          example: merchant_eead1d640d7c
      - name: alertReceivedAtGte
        in: query
        description: 'Return alerts received on or after this ISO 8601 timestamp (inclusive).

          Filters on the alert''s `createdAt` timestamp; the `alertReceivedAt` naming is kept

          for compatibility with the legacy alert-network proxy.

          '
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-02-01T00:00:00Z'
      - name: alertReceivedAtLte
        in: query
        description: 'Return alerts received on or before this ISO 8601 timestamp (inclusive).

          Must be greater than or equal to `alertReceivedAtGte` when both are provided.

          Filters on the alert''s `createdAt` timestamp; the `alertReceivedAt` naming is kept

          for compatibility with the legacy alert-network proxy.

          '
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-02-28T23:59:59Z'
      - name: sort
        in: query
        description: 'Sort order for the results. `alertReceivedAt` sorts on the alert''s `createdAt`

          timestamp; the `alertReceivedAt` naming is kept for compatibility with the legacy

          alert-network proxy. Alerts without an `actionRequiredDeadline` sort last when

          ascending (`actionRequiredDeadline`) and first when descending

          (`-actionRequiredDeadline`).

          '
        required: false
        schema:
          type: string
          enum:
          - -alertReceivedAt
          - alertReceivedAt
          - -actionRequiredDeadline
          - actionRequiredDeadline
          default: -alertReceivedAt
      - name: limit
        in: query
        description: Number of results per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: offset
        in: query
        description: Pagination offset.
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Returns a paginated list of Pre-Chargeback Alert objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PreChargebackAlert'
                  count:
                    type: integer
                    format: int64
                    description: The total number of alerts matching the filters.
                required:
                - items
                - count
              examples:
                SuccessfulList:
                  summary: Alerts successfully retrieved
                  value:
                    items:
                    - id: pre_chargeback_alert_eead1d640d7c
                      merchantId: merchant_eead1d640d7c
                      alertType: ETHOCA_ALERT
                      alertNetworkId: '1234567890'
                      status: ACTION_REQUIRED
                      chargebackReasonCode: '10.4'
                      transactionAmountInCents: 4999
                      transactionCurrencyCode: USD
                      transactionAuthorizedAt: '2025-02-10T10:30:00Z'
                      actionRequiredDeadline: '2025-02-17T10:30:00Z'
                      transactionAuthorizationCode: ABC123
                      transactionAcquirerReferenceNumber: '74027012345678901234567'
                      transactionStatementDescriptor: EXAMPLE STORE
                      transactionCardBin: '424242'
                      card:
                        bin: '424242'
                        lastFour: '4242'
                        brand: VISA
                        issuer: Example Bank
                      transactionRefundOutcome: null
                      transactionNetworkId: null
                      subscriptionCancelOutcome: null
                      note: null
                      integrationId: null
                      integrationTransactionId: null
                      createdAt: '2025-02-11T10:30:00Z'
                    count: 1
        '400':
          description: Invalid or unknown query parameters.
        '404':
          description: Pre-chargeback alerts have not been configured for the app.
