      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: The rule type. Currently only `AMOUNT` is supported.
                  enum:
                  - AMOUNT
                  example: AMOUNT
                parameters:
                  type: object
                  description: The rule parameters.
                  properties:
                    operator:
                      type: string
                      description: The comparison operator applied to the disputed amount.
                      enum:
                      - GREATER_THAN
                      - GREATER_THAN_OR_EQUAL
                      - LESS_THAN
                      - LESS_THAN_OR_EQUAL
                      - EQUAL
                      - NOT_EQUAL
                      example: LESS_THAN_OR_EQUAL
                    currencyCode:
                      type: string
                      description: The currency used for rule evaluation. Only `USD` is supported.
                      enum:
                      - USD
                      example: USD
                    amountInCents:
                      type: integer
                      format: int64
                      description: The threshold amount in cents.
                      minimum: 1
                      example: 5000
                  required:
                  - operator
                  - currencyCode
                  - amountInCents
              required:
              - type
              - parameters
            examples:
              AmountRule:
                summary: Refund Verifi alerts of $50.00 USD or less
                value:
                  type: AMOUNT
                  parameters:
                    operator: LESS_THAN_OR_EQUAL
                    currencyCode: USD
                    amountInCents: 5000
      responses:
        '201':
          description: Returns the created Pre-Chargeback Rule object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreChargebackRule'
              examples:
                SuccessfulCreation:
                  summary: Rule successfully created
                  value:
                    id: pre_chargeback_rule_eead1d640d7c
                    type: AMOUNT
                    outcome: REFUND
                    parameters:
                      operator: LESS_THAN_OR_EQUAL
                      currencyCode: USD
                      amountInCents: 5000
                    createdAt: '2025-02-11T10:30:00Z'
        '400':
          description: 'Invalid request — for example, the merchant has no Verifi RDR enrolment, a rule

            already exists, or the parameters are invalid.

            '
        '404':
          description: Merchant not found, or pre-chargeback alerts have not been configured.
    get:
      x-section: Payments
      x-group: Pre-Chargeback Alerts
      summary: List Pre-Chargeback Rules
      description: 'Returns the Verifi RDR refund rules for a merchant as a JSON array. A merchant has at

        most one rule, so this array contains zero or one item. Unlike the alerts list, the

        response is a bare array, not wrapped in an `{ items, count }` object.'
      operationId: listPreChargebackRules
      tags:
      - Payments
      security:
      - ApiKey:
        - preChargebackAlert:ruleRead
      parameters:
      - name: merchant_id
        in: path
        description: The unique identifier of the merchant.
        required: true
        schema:
          type: string
          example: merchant_eead1d640d7c
      responses:
        '200':
          description: Returns an array of Pre-Chargeback Rule objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreChargebackRule'
              examples:
                SuccessfulList:
                  summary: Rules successfully retrieved
                  value:
                  - id: pre_chargeback_rule_eead1d640d7c
                    type: AMOUNT
                    outcome: REFUND
                    parameters:
                      operator: LESS_THAN_OR_EQUAL
                      currencyCode: USD
                      amountInCents: 5000
                    createdAt: '2025-02-11T10:30:00Z'
        '404':
          description: Merchant not found, or pre-chargeback alerts have not been configured.
  /payments/pre-chargeback-alerts/merchants/{merchant_id}/rules/{rule_id}:
    get:
      x-section: Payments
      x-group: Pre-Chargeback Alerts
      summary: Retrieve a Pre-Chargeback Rule
      description: Retrieves a Verifi RDR refund rule by its unique identifier.
      operationId: getPreChargebackRule
      tags:
      - Payments
      security:
      - ApiKey:
        - preChargebackAlert:ruleRead
      parameters:
      - name: merchant_id
        in: path
        description: The unique identifier of the merchant.
        required: true
        schema:
          type: string
          example: merchant_eead1d640d7c
      - name: rule_id
        in: path
        description: The unique identifier of the rule.
        required: true
        schema:
          type: string
          example: pre_chargeback_rule_eead1d640d7c
      responses:
        '200':
          description: Returns a Pre-Chargeback Rule object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreChargebackRule'
              examples:
                SuccessfulRetrieval:
                  summary: Rule successfully retrieved
                  value:
                    id: pre_chargeback_rule_eead1d640d7c
                    type: AMOUNT
                    outcome: REFUND
                    parameters:
                      operator: LESS_THAN_OR_EQUAL
                      currencyCode: USD
                      amountInCents: 5000
                    createdAt: '2025-02-11T10:30:00Z'
        '404':
          description: Rule not found, or does not belong to the merchant.
    patch:
      x-section: Payments
      x-group: Pre-Chargeback Alerts
      summary: Update a Pre-Chargeback Rule
      description: 'Updates a Verifi RDR refund rule. A rule''s `type` cannot be changed — only its

        `parameters`. `parameters` is replaced, not merged, so send the complete object

        (`operator`, `currencyCode`, `amountInCents`). Omitting `parameters` entirely is a

        no-op — the rule is returned unchanged.'
      operationId: updatePreChargebackRule
      tags:
      - Payments
      security:
      - ApiKey:
        - preChargebackAlert:ruleUpdate
      parameters:
      - name: merchant_id
        in: path
        description: The unique identifier of the merchant.
        required: true
        schema:
          type: string
          example: merchant_eead1d640d7c
      - name: rule_id
        in: path
        description: The unique identifier of the rule.
        required: true
        schema:
          type: string
          example: pre_chargeback_rule_eead1d640d7c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  description: 'The complete rule parameters. Replaces the existing parameters entirely.

                    '
                  properties:
                    operator:
                      type: string
                      enum:
                      - GREATER_THAN
                      - GREATER_THAN_OR_EQUAL
                      - LESS_THAN
                      - LESS_THAN_OR_EQUAL
                      - EQUAL
                      - NOT_EQUAL
                      example: LESS_THAN_OR_EQUAL
                    currencyCode:
                      type: string
                      enum:
                      - USD
                      example: USD
                    amountInCents:
                      type: integer
                      format: int64
                      minimum: 1
                      example: 10000
                  required:
                  - operator
                  - currencyCode
                  - amountInCents
            examples:
              UpdateThreshold:
                value:
                  parameters:
                    operator: LESS_THAN_OR_EQUAL
                    currencyCode: USD
                    amountInCents: 10000
      responses:
        '200':
          description: Returns the updated Pre-Chargeback Rule object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreChargebackRule'
              examples:
                SuccessfulUpdate:
                  summary: Rule successfully updated
                  value:
                    id: pre_chargeback_rule_eead1d640d7c
                    type: AMOUNT
                    outcome: REFUND
                    parameters:
                      operator: LESS_THAN_OR_EQUAL
                      currencyCode: USD
                      amountInCents: 10000
                    createdAt: '2025-02-11T10:30:00Z'
        '400':
          description: Invalid, empty, or partial rule parameters.
        '404':
          description: Rule not found, or does not belong to the merchant.
    delete:
      x-section: Payments
      x-group: Pre-Chargeback Alerts
      summary: Delete a Pre-Chargeback Rule
      description: 'Deletes a Verifi RDR refund rule. Deleting a rule restores the default behaviour: all

        Verifi alerts for that merchant are refunded. Delete is not idempotent — retrying a

        successful delete will not return `204`.'
      operationId: deletePreChargebackRule
      tags:
      - Payments
      security:
      - ApiKey:
        - preChargebackAlert:ruleDelete
      parameters:
      - name: merchant_id
        in: path
        description: The unique identifier of the merchant.
        required: true
        schema:
          type: string
          example: merchant_eead1d640d7c
      - name: rule_id
        in: path
        description: The unique identifier of the rule.
        required: true
        schema:
          type: string
          example: pre_chargeback_rule_eead1d640d7c
      responses:
        '204':
          description: Rule successfully deleted.
        '404':
          description: Rule not found, already deleted, or does not belong to the merchant.
components:
  schemas:
    PreChargebackAlertsEnrolmentInput:
      type: object
      summary: Pre-Chargeback Alerts Enrolment Input
      description: 'The enrolment fields shared by the pre-chargeback alerts create and update configs:

        the chargeback merchant type, and the Ethoca and Verifi RDR enrolment details.

        '
      properties:
        merchantType:
          type: string
          description: The chargeback merchant type. When omitted, a default is applied.
        ethocaAlert:
          type: object
          description: The Merchant's Ethoca alert enrolment configuration.
          properties:
            descriptors:
              type: array
              description: 'The billing descriptors to enroll for Ethoca alerts. Each `descriptor` must be

                1–100 printable ASCII characters.

                '
              minItems: 1
              maxItems: 50
              items:
                type: object
                properties:
                  descriptor:
                    type: string
                    description: The billing descriptor to match against. Must contain printable ASCII characters only.
                    maxLength: 100
                    example: ACME LTD
                  matchType:
                    type: string
                    description: How the descriptor is matched against transactions.
                    enum:
                    - STARTS_WITH
                    - EXACT_MATCH
                    example: STARTS_WITH
                required:
                - descriptor
                - matchType
          required:
          - descriptors
        verifiRdr:
          type: object
          description: 'The Merchant''s Verifi RDR enrolment configuration. Provide either `bin` and `caid`

            together, or at least one ARN in `arns`.

            '
          properties:
            bin:
              type: string
              description: The Bank Identification Number (BIN) associated with the Merchant. Must be exactly 6 digits.
              pattern: ^[0-9]{6}$
              example: '424242'
            caid:
              type: string
              description: The Card Acceptor ID (CAID) associated with the Merchant. Must be exactly 15 alphanumeric characters.
              pattern: ^[a-zA-Z0-9]{15}$
              example: '123456789012345'
            arns:
              type: array
              description: The Acquirer Reference Numbers (ARNs) to enroll.
              maxItems: 50
              items:
                type: string
                pattern: ^[0-9]{23}$
                example: '12345678901234567890123'
    ThreeDSChallenge:
      type: object
      description: Details about the 3DS challenge.
      properties:
        preference:
          type: string
          description: The 3DS challenge preference.
          enum:
          - no-preference
          - challenge-requested
          - challenge-mandated
          - no-challenge-requested
        reason:
          type:
          - 'null'
          - string
          description: The reason for not requesting a challenge. This value should only be present when the preference is `no-challenge-requested`.
          enum:
          - null
          - data-sharing
          - low-value
          - low-risk
          - secure-corporate-payment
          - authentication-already-performed
      required:
      - preference
    PaymentInstallment:
      type: object
      summary: Installment Payment
      description: A repeating payment for paying a total amount in multiple installments.
      properties:
        type:
          type: string
          description: The value `installment`.
          enum:
          - installment
        amount:
          type: integer
          description: The amount of the payment in the smallest currency unit (e.g. cents).
          example: 1000
        currency:
          type: string
          format: iso-4217-alphabetic
          description: The currency of the payment.
          example: gbp
        installments:
          type: integer
          description: The number of installments.
          example: 12
        frequency:
          type: string
          description: Indicates the minimum time between authorizations.
          enum:
          - daily
          - weekly
          - monthly
          - quarterly
          - annually
          example: monthly
        expiry:
          type: integer
          description: The epoch time in seconds when the installment expires. Maximum value is 4102394400 (equivalent to 2099-12-31).
      required:
      - type
      - amount
      - currency
      - installments
      - frequency
    Address:
      type: object
      properties:
        line1:
          type: string
          description: 'The first line of the address.

            '
          pattern: ^[À-ÖØ-öø-ǿa-zA-Z0-9().\-_#,;/@$!% ]+$
          maxLength: 60
          example: 123 Main St
        line2:
          type: string
          description: 'The second line of the address.

            '
          pattern: ^[À-ÖØ-öø-ǿa-zA-Z0-9().\-_#,;/@$!% ]+$
          maxLength: 60
          example: Floor 4
        city:
          type: string
          description: The city where the address is located.
          pattern: "^[0-9a-zA-Z _\\-¡-\uFFFF]+$"
          maxLength: 50
          example: Springfield
        state:
          type: string
          description: The state or province code. Required when `country` is `us`, `ca`, or `au`.
          format: iso-3166-2-subdivision
          example: ny
        postalCode:
          type: string
          description: The postal code of the address.
          pattern: ^[0-9a-zA-Z ]*$
          maxLength: 20
          example: 13468
        country:
          type: string
          format: iso-3166-1-alpha-2
          description: The country where the address is located.
          example: us
      required:
      - line1
      - city
      - postalCode
      - country
    PaymentRecurring:
      type: object
      summary: Recurring Payment
      description: A repeating payment with a regular interval.
      properties:
        type:
          type: string
          description: The value `recurring`.
          enum:
          - recurring
        amount:
          type: integer
          description: The amount of the payment in the smallest currency unit (e.g. cents).
          example: 1000
        currency:
          type: string
          format: iso-4217-alphabetic
          description: The currency of the payment.
          example: gbp
        frequency:
          type: string
          description: Indicates the minimum time between authorizations.
          enum:
          - daily
          - weekly
          - monthly
          - quarterly
          - annually
          example: monthly
        expiry:
          type: integer
          description: The epoch time in seconds when the recurring payment expires. Maximum value is 4102394400 (equivalent to 2099-12-31).
      required:
      - type
      - amount
      - currency
      - frequency
      - expiry
    BinLookup:
      x-section: Payments
      x-group: BIN Lookups
      type: object
      summary: The BIN Lookup Object
      properties:
        id:
          type: string
          description: The unique identifier for the BIN lookup
          example: bin_lookup_1234567890
        brand:
          $ref: '#/components/schemas/CardBrand'
        funding:
          $ref: '#/components/schemas/CardFunding'
        segment:
          $ref: '#/components/schemas/CardSegment'
        country:
          type: string
          format: iso-3166-1-alpha-2
          description: The country associated with the card.
          example: gb
        currency:
          type: string
          description: The currency associated with the card (ISO 4217)
          example: gbp
        issuer:
          type: string
          description: The name of the issuer bank
          example: Gringotts Wizarding Bank and Trust Company
        type:
          type:
          - 'null'
          - string
          enum:
          - null
          - card
          - network-token
          x-enum-description:
            card: A card range was identified
            network-token: A network token range was identified
            'null': None identified
          description: Type of card range identified during the lookup
          example: null
        productName:
          type: string
          description: The name of the product associated with the card
          example: Visa Debit
        fastFunds:
          $ref: '#/components/schemas/CardFastFunds'
        matchPrecision:
          type: number
          description: Indicates how many leading digits of the submitted BIN are confirmed by the matched data. A higher value means a more specific match. When multiple matches are found, the value represents the least precise BIN range the submitted BIN could belong to.
          example: 8
        threeDS:
          $ref: '#/components/schemas/CardThreeDSMetadata'
        createdAt:
          type: integer
          description: Unix timestamp of when the BIN lookup was created
          example: 169297262323
      required:
      - id
      - createdAt
      example:
        id: bin_lookup_1234567890
        brand: visa
        funding: credit
        segment: consumer
        country: gb
        currency: gbp
        issuer: Gringotts Wizarding Bank and Trust Company
        productName: Visa Debit
        fastFunds:
          domestic: true
          crossBorder: false
        type: card
        createdAt: 169297262323
    CardThreeDSMetadata:
      type: object
      summary: 3DS
      description: "Metadata about 3DS capabilities, including supported versions \nand ACS (Access Control Server) indicators.\n"
      properties:
        supportedVersions:
          type: object
          description: The 3DS versions supported by the ACS and DS
          properties:
            accessControlServer:
              type: array
              items:
                type: string
                description: Array of 3DS versions supported by the Access Control Server
                example: 2.2.0
            directoryServer:
              type: array
              items:
                type: string
                description: Array of 3DS versions supported by the Directory Server
                example: 2.3.1
        acsInfoIndicators:
          type: array
          description: Array of ACS information indicators
          items:
            type: object
            properties:
              code:
                type: string
                description: 'The indicator code, the following values are supported:


                  - `authentication-available`

                  - `attempts-supported`

                  - `decoupled-authentication-supported`

                  - `trustlist-supported`

                  - `device-binding-supported`

                  - `webauthn-authentication-supported`

                  - `spc-authentication-supported`

                  - `tra-exemption-supported`

                  - `trustlist-exemption-supported`

                  - `low-value-exemption-supported`

                  - `secure-corporate-payments-exemption-supported`

                  - `emvco-reserved`

                  - `ds-reserved`


                  **American Express only:**

                  - `issuer-tra-exemption-supported`

                  - `issuer-trustlist-exemption-supported`

                  - `issuer-low-value-exemption-supported`

                  - `issuer-secure-corporate-payments-exemption-supported`

                  - `bridging-message-extension-supported`


                  **Mastercard only:**

                  - `smart-auth-direct-stand-in-only`

                  - `smart-auth-direct`

                  - `payment-transactions-supported`

                  - `non-payment-transactions-supported`

                  - `app-channel-supported`

                  - `browser-channel-supported`

                  - `app-acs-challenge-supported`

                  - `browser-acs-challenge-supported`


                  **Visa only:**

                  - `issuer-tra-exemption-supported`

                  - `data-only-supported`

                  - `delegated-authentication-supported`

                  - `digital-auth-framework-supported`

                  '
              indicator:
                type: string
                description: The raw numeric indicator value, ranges from 01 to 99
              description:
                type: string
                description: Human-readable description of the indicator
            required:
            - indicator
      required:
      - supportedVersions
    CardInsightCapabilities:
      type: object
      summary: The push or pull capability of the card.
      properties:
        enabled:
          type: boolean
          description: Indicates if push or pull transactions are enabled for the supplied card
          example: true
        network:
          type: string
          description: The card network for the supplied card
          example: visa
        type:
          type: string
          description: The funding type of the card
          example: credit
        availability:
          type: string
          description: Indicates the typical time for payouts
          enum:
          - immediate
          - next-day
          - next-few
        regulated:
          type: boolean
          description: Indicates if the issuer is a regulated institution
          example: true
        currency:
          type: object
          description: The currency of the card
          properties:
            alphaCode:
              type: string
              description: The ISO 4217 alphabetic code for the currency
              example: usd
            numericCode:
              type: string
              description: The ISO 4217 numeric code for the currency
              example: '840'
          required:
          - alphaCode
          - numericCode
        country:
          type: object
          description: The country the card is issued in
          properties:
            alphaCode:
              type: string
              description: The ISO 3166-1 two character alphabetic code for the country
              example: us
            numericCode:
              type: string
              description: The ISO 3166-1 three digit code for the country
              example: '840'
          required:
          - alphaCode
          - numericCode
    ParLookup:
      x-section: Payments
      x-group: PAR Lookups
      type: object
      summary: The PAR Lookup Object
      properties:
        id:
          type: string
          description: The unique identifier for the PAR lookup
          example: par_lookup_1234567890
        paymentAccountReference:
          type: string
          description: 'The Payment Account Reference (PAR) for the supplied card. This is a stable identifier assigned by the

            card network that stays constant across card reissues, renewals, and replacements, and is shared by every

            network token derived from the card.

            '
          example: 5001BN2CUZCOY2H2IJILTJJZWTEPW
      required:
      - id
      - paymentAccountReference
      example:
        id: par_lookup_1234567890
        paymentAccountReference: 5001BN2CUZCOY2H2IJILTJJZWTEPW
    ThreeDSSession:
      type: object
