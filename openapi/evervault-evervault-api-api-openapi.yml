components:
  schemas:
    PaymentOneOff:
      type: object
      summary: One-Off Payment
      description: A payment that is made in a single transaction.
      properties:
        type:
          type: string
          description: The value `one-off`.
          enum:
          - one-off
          example: one-off
        amount:
          type: integer
          description: The amount of the payment in the smallest currency unit (e.g. cents).
          example: 1000
        currency:
          type: string
          format: iso-4217-alphabetic
          description: The currency of the payment.
          example: gbp
      required:
      - type
      - amount
      - currency
    FunctionRun:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier representing this specific Function execution instance.
          example: func_run_eead1d640d7c
        status:
          type: string
          description: The outcome of the Function execution.
          enum:
          - success
          - failure
          - scheduled
          x-enum-description:
            success: The Function executed successfully
            failure: The Function encountered an error
            scheduled: The Function execution has been queued
          example: success
        result:
          type: object
          description: This field represents the output returned by the Function. This is provided only when the Function execution status is 'success'.
          example:
            message: Hello, World
        error:
          type:
          - object
          - 'null'
          description: This field details any error that occurred during Function execution. This is present only if the status is 'failure'.
          properties:
            message:
              type: string
              description: A concise explanation of the error that occurred during Function execution.
              example: Some error message!
            stack:
              type: string
              description: A trace detailing the sequence of events leading to the error, useful for debugging purposes.
              example: "Error: Some error message!\n    at exports.handler (/runtime/app/index.js:5:11)\n    at /runtime/index.js:64:26\n    at new Promise (<anonymous>)\n    at /runtime/index.js:51:16"
        createdAt:
          type: integer
          format: int64
          description: The exact time, in epoch milliseconds, when this Function execution was triggered.
          example: 1692972623233
    ThreeDSAccessControlServer:
      type: object
      description: Details about the Access Control Server involved in the 3DS transaction.
      properties:
        transactionIdentifier:
          type: string
          description: The Access Control Server's transaction identifier.
          example: d351441b-f9e6-46e3-a726-9fc4f39bbaaa
        referenceNumber:
          type: string
          description: The Access Control Server's reference number assigned by EMVCo.
          example: 3DS_LOA_ACS_STIN_020200_00417
        operatorIdentifier:
          type:
          - 'null'
          - string
          description: The identifier of the Access Control Server's operator, when the ACS provides it.
          example: Evervault
    PaymentInstallment:
      type: object
      summary: Installment Payment
      description: A repeating payment for paying a total amount in multiple installments.
      properties:
        type:
          type: string
          description: The value `installment`.
          enum:
          - installment
        amount:
          type: integer
          description: The amount of the payment in the smallest currency unit (e.g. cents).
          example: 1000
        currency:
          type: string
          format: iso-4217-alphabetic
          description: The currency of the payment.
          example: gbp
        installments:
          type: integer
          description: The number of installments.
          example: 12
        frequency:
          type: string
          description: Indicates the minimum time between authorizations.
          enum:
          - daily
          - weekly
          - monthly
          - quarterly
          - annually
          example: monthly
        expiry:
          type: integer
          description: The epoch time in seconds when the installment expires. Maximum value is 4102394400 (equivalent to 2099-12-31).
      required:
      - type
      - amount
      - currency
      - installments
      - frequency
    Acquirer:
