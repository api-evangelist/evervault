          description: 'The request was invalid or cannot be otherwise served.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ShortNameRequired:
                  summary: Short Name Required
                  value:
                    code: payments/3ds-sessions/short-name-required
